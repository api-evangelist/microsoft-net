deprecation:
  policy_url: https://learn.microsoft.com/en-us/dotnet/core/compatibility/
  sunset_header: false
  note: >-
    .NET publishes a per-release breaking-change catalogue at learn.microsoft.com/dotnet/core/compatibility,
    organized by version and area, plus obsoletion diagnostics (SYSLIBxxxx) that surface deprecations at
    compile time rather than at runtime. The NuGet Server API does not emit RFC 8594 Sunset or
    Deprecation headers; API-level deprecation is announced on the .NET blog and signalled in-band by an
    OData error code (see api_deprecations below).
api_deprecations:
