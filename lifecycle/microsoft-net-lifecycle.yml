      date: '2026-08-29'
      request: 'GET https://www.nuget.org/api/v2/Packages?$top=1'
      observed_status: 400
      observed_code: NuGet.V2.Deprecated
    migration: >-
      Move to the V3 API discovered from https://api.nuget.org/v3/index.json. The scoped V2 queries the
      official client (nuget.exe) makes remain supported; only arbitrary third-party OData query shapes
      were blocked.
    announcement: https://devblogs.microsoft.com/dotnet/custom-v2-odata-queries-will-be-deprecated-march-9-2021/
