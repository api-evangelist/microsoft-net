note: >-
  The NuGet data model is unusual in that its entities are linked by hypermedia rather than by opaque
  ids: every document carries an "@id" that is an absolute URL to the next document, and "@type" names
  its role. There are no id prefixes to catalogue. The natural key throughout is the (id, version) pair,
  with id lowercased and version normalized in every URL path.
identifiers:
  primary_key: (id, version)
  id_format: case-insensitive package identifier; MUST be lowercased in URL paths
  version_format: SemVer 1.0.0 or 2.0.0 (semVerLevel selects the hive); MUST be normalized in URL paths
  id_prefixes: []
  hypermedia: true
  hypermedia_note: '@id is an absolute URL; @type is the JSON-LD-style resource type.'
entities:
  - name: ServiceIndex
    schema: openapi/microsoft-net-serviceindex-api-openapi.yml#/components/schemas/ServiceIndex
    description: The root discovery document for a package source. Everything else is reached from here.
    fields: [version, resources]
    domain: discovery
  - name: Resource
    description: One typed endpoint entry inside the service index.
    fields: ['@id', '@type', comment]
    domain: discovery
  - name: SearchResponse
    schema: openapi/microsoft-net-search-api-openapi.yml#/components/schemas/SearchResponse
    fields: [totalHits, data]
