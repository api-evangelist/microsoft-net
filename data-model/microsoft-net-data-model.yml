    domain: metadata
  - name: RegistrationLeaf
    description: Per-version metadata document, returned by getRegistrationLeaf.
    domain: metadata
  - name: PackageVersions
    description: The flat-container version list for a package, returned by listPackageVersions.
    fields: [versions]
    domain: content
  - name: PackageContent
    description: The .nupkg binary itself, returned by downloadPackage.
    domain: content
  - name: Nuspec
    description: The package manifest XML, returned by downloadNuspec.
    domain: content
