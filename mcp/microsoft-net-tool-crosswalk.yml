note: >-
  The honest finding here is that Microsoft .NET's MCP surface and its REST surface do not overlap at
  all. The remote Learn Docs MCP server exposes documentation retrieval tools, which have no backing
  operation in the NuGet Server API. The local-stdio NuGet MCP server works against a developer's
  project files and configured feeds rather than against the public V3 REST endpoints, and it does not
  publish a tool list — so nothing on that server could be bound to an operationId without inventing
  the tool names, which this crosswalk does not do. Every NuGet V3 operation is therefore rest_only.
