note: 'Two distinct first-party Microsoft MCP servers touch this surface and they are NOT the same product.
  (1) The NuGet MCP Server is local-stdio only: it is a NuGet tool package launched with the .NET 10 `dnx`
  command, so a human must install .NET 10 and run it before any agent can reach it. (2) The Microsoft
  Learn Docs MCP Server is a remote streamable-HTTP endpoint an MCP client can POST to right now with
  no credential — verified by an anonymous tools/list on 2026-08-29 that returned three tools with real
  inputSchemas. The Learn server is Microsoft-wide (it indexes all of Microsoft Learn, not just .NET),
  and learn.microsoft.com is already the documentation and humanURL host for every API entry in this profile,
  which is why it is recorded here; it is not a .NET-exclusive surface.'
servers:
